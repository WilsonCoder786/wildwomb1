name: easy_four_diy
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.1+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  # iap
  connectivity_plus: ^7.1.1
  in_app_purchase: ^3.2.3
  in_app_purchase_android: ^0.4.0+7
  in_app_purchase_storekit: ^0.4.8

  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  intl: ^0.20.2
  flutter_easyloading: ^3.0.5
  video_player: ^2.9.5
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  uuid: ^4.3.3
  google_mobile_ads: ^8.0.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13
  change_app_package_name: ^1.5.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/app_logo.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  web:
    generate: false

flutter:
  generate: true

  uses-material-design: true

  assets:
    - assets/images/
    - assets/videos/
    - assets/data/

  fonts:
    - family: D-FONT-R
      fonts:
        - asset: assets/fonts/Rubik-Regular.ttf
          style: normal
    - family: D-FONT-M
      fonts:
        - asset: assets/fonts/Rubik-Medium.ttf
          style: normal
